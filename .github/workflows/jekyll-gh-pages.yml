# Build and deploy the Jekyll site to GitHub Pages.
#
# Uses ruby/setup-ruby + `bundle exec jekyll build` rather than
# actions/jekyll-build-pages, because that action runs Jekyll with --safe
# which blocks custom _plugins/*.rb (e.g. include_file.rb, raise_error.rb).
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      # Replace __SECRET_NAME__ placeholders in source files with actual secret values.
      # To add a new secret: (1) add to env below, (2) add to the for loop, (3) run `gh secret set <NAME>`,
      # (4) add to .env for local dev, (5) use __NAME__ as placeholder in code.
      - name: Inject secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          for secret in TMDB_API_KEY; do
            find . -type f \( -name "*.js" -o -name "*.html" -o -name "*.json" \) \
              -exec sed -i "s|__${secret}__|${!secret}|g" {} +
          done
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
