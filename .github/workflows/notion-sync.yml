name: Notion CMS daily sync

on:
  schedule:
    # 09:00 UTC = 03:00 MT (standard) / 02:00 MT (DST)
    # schedule: fires only on the default branch (master)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # needed to dispatch jekyll-gh-pages.yml after a push

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run Notion sync
        env:
          # Requires NOTION_API_TOKEN secret (set via `gh secret set NOTION_API_TOKEN`)
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: uv run --project _env/notion_bridge python3 _env/notion_bridge/cli.py

      # Surface any conflict diffs the bridge emitted, so they're visible in
      # the Actions log instead of stranded in a gitignored directory.
      - name: Surface conflict diffs
        if: always()
        run: |
          if [ -d _env/notion_bridge/conflicts ] && [ -n "$(ls -A _env/notion_bridge/conflicts 2>/dev/null)" ]; then
            echo "::group::Conflict diffs"
            for f in _env/notion_bridge/conflicts/*.diff; do
              echo "--- $f ---"
              cat "$f"
            done
            echo "::endgroup::"
          fi

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "chore: daily notion sync"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN-initiated pushes don't trigger other workflows, so we
      # explicitly dispatch the Jekyll build. Scoped to master so manual
      # dispatches on feature branches don't accidentally deploy anything.
      - name: Trigger Jekyll build
        if: steps.commit.outputs.pushed == 'true' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run jekyll-gh-pages.yml
